.sec{margin-top:14px}
.sec h5{font-size:12px;margin-bottom:6px;color:var(--txt)}

  document.getElementById(&#x27;bet-count&#x27;).textContent=&#x27;共 &#x27;+rows.length+&#x27; 条&#x27;;
