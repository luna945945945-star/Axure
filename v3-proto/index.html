<!doctype html>

    <script>
      // [部署兜底] SPA 深链还原：配合 GitHub Pages 根 404.html 重定向，把 /base/?/x/y 还原成 /base/x/y
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
      // [部署兜底] 线上(github.io)注入演示 token 跳过登录；本地 dev 不受影响
      try {
        if (location.hostname.endsWith('github.io') || location.hostname === 'v3-lottoplatform-backend.pages.dev') {
          var __k = 'ACCESS-TOKEN';
          if (!localStorage.getItem(__k)) {
            localStorage.setItem(__k, JSON.stringify({ value: 'prototype-demo', expire: null }));
          }
          // 角色不再在此预设默认值——已改由 role.ts 的 lockedRole() 按部署路径强制锁定
          // （/lotto-v3-admin/ → admin，/lotto-v3/ → tenant，不可通过浮窗互切，2026-07-22）
        }
      } catch (e) {}
    </script>

    <div id="appProvider" style="display: none"></div>

      <style>
        .first-loading-wrap {
          display: flex;
          width: 100%;
          height: 100vh;
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }

        .first-loading-wrap > h1 {
          font-size: 128px;
        }

        .first-loading-wrap .loading-wrap {
          padding: 98px;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .dot {
          animation: antRotate 1.2s infinite linear;
          transform: rotate(45deg);
          position: relative;
          display: inline-block;
          font-size: 32px;
          width: 32px;
          height: 32px;
          box-sizing: border-box;
        }

        .dot i {
          width: 14px;
          height: 14px;
          position: absolute;
          display: block;
          background-color: #1890ff;
          border-radius: 100%;
          transform: scale(0.75);
          transform-origin: 50% 50%;
          opacity: 0.3;
          animation: antSpinMove 1s infinite linear alternate;
        }

        .dot i:nth-child(1) {
          top: 0;
          left: 0;
        }

        .dot i:nth-child(2) {
          top: 0;
          right: 0;
          -webkit-animation-delay: 0.4s;
          animation-delay: 0.4s;
        }

        .dot i:nth-child(3) {
          right: 0;
          bottom: 0;
          -webkit-animation-delay: 0.8s;
          animation-delay: 0.8s;
        }

        .dot i:nth-child(4) {
          bottom: 0;
          left: 0;
          -webkit-animation-delay: 1.2s;
          animation-delay: 1.2s;
        }

        @keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }

        @-webkit-keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }

        @keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }

        @-webkit-keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }
      </style>
      <div class="first-loading-wrap">
        <div class="loading-wrap">
          <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
    </div>
